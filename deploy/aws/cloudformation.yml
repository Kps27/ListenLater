AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Listen Later on one always-on EC2 instance. The website, the API, and the
  SQLite file live on this machine. Point WebDomain and ApiDomain at the
  elastic IP, copy the repo to /opt/listen-later, then start listen-later.service.

Parameters:
  WebDomain:
    Type: String
    Description: Public site name, for example listenlater.example.com
  ApiDomain:
    Type: String
    Description: API name, for example api.listenlater.example.com
  AcmEmail:
    Type: String
    Description: Email for the TLS certificate
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Admin password. It is not shown on the site.
  InboundDomain:
    Type: String
    Default: save.listenlater.in
    AllowedPattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$"
    Description: Domain that receives forwarded newsletters, for example save.listenlater.in
  InboundSecret:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Shared secret for inbound mail. Paste the same value in the site Admin under Inbound mail.
  InstanceType:
    Type: String
    Default: t3.small
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Listen Later web and API
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /usr/lib/docker/cli-plugins /opt/listen-later/data
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          cp /usr/local/lib/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose
          cat > /etc/listen-later.env <<'ENV'
          WEB_DOMAIN=${WebDomain}
          API_DOMAIN=${ApiDomain}
          ACME_EMAIL=${AcmEmail}
          LL_ADMIN_PASSWORD=${AdminPassword}
          LL_INBOUND_WEBHOOK_SECRET=
          ENV
          echo "Copy the repo to /opt/listen-later. Then: cp /etc/listen-later.env /opt/listen-later/deploy/aws/.env && cp /opt/listen-later/deploy/aws/listen-later.service /etc/systemd/system/ && systemctl enable --now listen-later" > /etc/listen-later-next.txt
      Tags:
        - Key: Name
          Value: listen-later

  Address:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Server
      Domain: vpc

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-inbound
            Status: Enabled
            ExpirationInDays: 7
            Prefix: inbound/

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPut
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${MailBucket.Arn}/inbound/*"
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref WebDomain
      DkimAttributes:
        SigningEnabled: true

  MailForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-inbound-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/inbound/*"

  MailForwarder:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt MailForwarderRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref MailBucket
          WEBHOOK_URL: !Sub "https://${ApiDomain}/v1/webhooks/inbound-email"
          WEBHOOK_SECRET: !Ref InboundSecret
      Code:
        ZipFile: |
          const { S3Client, GetObjectCommand } = require("@aws-sdk/client-s3");
          const https = require("https");
          const s3 = new S3Client({});
          function header(raw, name) {
            const match = raw.match(new RegExp("^" + name + ":\\s*(.*(?:\\r?\\n[ \\t].*)*)", "im"));
            return match ? match[1].replace(/\r?\n[ \t]+/g, " ").trim() : "";
          }
          function decode(body, enc) {
            if ((enc || "").toLowerCase().includes("base64")) return Buffer.from(body.replace(/\s/g, ""), "base64").toString("utf8");
            const bytes = [];
            const cleaned = body.replace(/=\r?\n/g, "");
            for (let i = 0; i < cleaned.length; i++) {
              if (cleaned[i] === "=" && /^[0-9A-Fa-f]{2}/.test(cleaned.slice(i + 1, i + 3))) {
                bytes.push(parseInt(cleaned.slice(i + 1, i + 3), 16));
                i += 2;
              } else bytes.push(cleaned.charCodeAt(i) & 255);
            }
            return Buffer.from(bytes).toString("utf8");
          }
          function textFrom(raw) {
            const parts = raw.split(/\r?\n\r?\n/);
            const headers = parts.shift() || "";
            const rest = parts.join("\n\n");
            const type = header(headers, "content-type");
            const boundary = /boundary="?([^";]+)"?/i.exec(type);
            if (!boundary) return decode(rest, header(headers, "content-transfer-encoding"));
            const fence = boundary[1].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            let plain = "";
            let html = "";
            for (const chunk of rest.split(new RegExp("--" + fence))) {
              const bits = chunk.split(/\r?\n\r?\n/);
              const head = bits.shift() || "";
              const decoded = decode(bits.join("\n\n"), header(head, "content-transfer-encoding"));
              const kind = header(head, "content-type");
              if (/text\/plain/i.test(kind) && !plain) plain = decoded;
              if (/text\/html/i.test(kind) && !html) html = decoded;
            }
            const links = [...html.matchAll(/href=["'](https?:\/\/[^"']+)["']/gi)].map((item) => item[1]);
            return [plain, links.join("\n")].filter(Boolean).join("\n\n") || html;
          }
          exports.handler = async (event) => {
            const rec = event.Records[0];
            const id = rec.ses.mail.messageId;
            const obj = await s3.send(new GetObjectCommand({ Bucket: process.env.BUCKET, Key: "inbound/" + id }));
            const raw = await obj.Body.transformToString();
            const headers = raw.split(/\r?\n\r?\n/)[0] || "";
            const body = JSON.stringify({
              To: header(headers, "to") || (rec.ses.mail.destination || []).join(", "),
              From: header(headers, "from") || rec.ses.mail.source,
              Subject: header(headers, "subject"),
              TextBody: textFrom(raw).slice(0, 200000)
            });
            await new Promise((resolve, reject) => {
              const req = https.request(process.env.WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(body), "x-ll-secret": process.env.WEBHOOK_SECRET }
              }, (res) => { res.resume(); res.on("end", resolve); });
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          };

  MailForwarderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailForwarder
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  MailRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: listen-later

  MailRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - MailBucketPolicy
      - MailForwarderPermission
    Properties:
      RuleSetName: !Ref MailRuleSet
      Rule:
        Name: listen-later-save
        Enabled: true
        ScanEnabled: false
        Recipients:
          - !Ref InboundDomain
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt MailForwarder.Arn
              InvocationType: RequestResponse

  MailActivatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: activate-rule-set
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SetActiveReceiptRuleSet
                Resource: "*"

  MailActivator:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt MailActivatorRole.Arn
      Code:
        ZipFile: |
          const https = require("https");
          const { SESClient, SetActiveReceiptRuleSetCommand } = require("@aws-sdk/client-ses");
          function reply(event, status, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || "ok",
              PhysicalResourceId: "listen-later-active-rules",
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              Data: {}
            });
            const url = new URL(event.ResponseURL);
            return new Promise((resolve, reject) => {
              const req = https.request({ hostname: url.hostname, path: url.pathname + url.search, method: "PUT", headers: { "Content-Type": "", "Content-Length": Buffer.byteLength(body) } }, (res) => { res.resume(); res.on("end", resolve); });
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }
          exports.handler = async (event) => {
            try {
              const ses = new SESClient({});
              if (event.RequestType === "Delete") {
                await ses.send(new SetActiveReceiptRuleSetCommand({}));
              } else {
                await ses.send(new SetActiveReceiptRuleSetCommand({ RuleSetName: event.ResourceProperties.RuleSetName }));
              }
              await reply(event, "SUCCESS");
            } catch (err) {
              await reply(event, "FAILED", err.message);
              throw err;
            }
          };

  MailRuleSetActive:
    Type: Custom::MailRuleSetActive
    DependsOn: MailRule
    Properties:
      ServiceToken: !GetAtt MailActivator.Arn
      RuleSetName: !Ref MailRuleSet

Outputs:
  PublicIp:
    Value: !Ref Address
  WebUrl:
    Value: !Sub https://${WebDomain}
  ApiUrl:
    Value: !Sub https://${ApiDomain}
  Dns:
    Description: Create these two A records at the domain host, both aimed at PublicIp.
    Value: !Sub "${WebDomain} and ${ApiDomain} -> ${Address}"
  InboundMx:
    Description: MX record at the domain host. Host is the first label of InboundDomain. Do not add an A record for it.
    Value: !Sub "${InboundDomain} MX 10 inbound-smtp.${AWS::Region}.amazonaws.com"
  Dkim1:
    Description: CNAME at the domain host so Amazon can receive mail.
    Value: !Sub "${MailIdentity.DkimDNSTokenName1} CNAME ${MailIdentity.DkimDNSTokenValue1}"
  Dkim2:
    Description: CNAME at the domain host so Amazon can receive mail.
    Value: !Sub "${MailIdentity.DkimDNSTokenName2} CNAME ${MailIdentity.DkimDNSTokenValue2}"
  Dkim3:
    Description: CNAME at the domain host so Amazon can receive mail.
    Value: !Sub "${MailIdentity.DkimDNSTokenName3} CNAME ${MailIdentity.DkimDNSTokenValue3}"
